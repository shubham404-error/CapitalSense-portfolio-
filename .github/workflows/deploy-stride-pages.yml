name: Deploy Capital Sense and Stride demo
on:
  push:
    branches: [feature/sip-social-app]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write
    outputs:
      backend_status: ${{ steps.readiness.outputs.summary }}
      category_images: ${{ steps.stride.outputs.category_images }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stride
        uses: actions/checkout@v4
        with:
          path: stride-source
      - name: Check out existing Capital Sense site
        uses: actions/checkout@v4
        with:
          ref: feature/website-v1
          path: website-source
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            stride-source/package-lock.json
            website-source/package-lock.json
      - name: Build existing website
        working-directory: website-source
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build static Stride demo
        id: stride
        working-directory: stride-source
        env:
          PAGES_BASE_PATH: /CapitalSense-portfolio-/stride
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/sync-category-images.mjs
          npm run typecheck
          npm run test:backend
          npm run build:pages
      - name: Retain the downloaded artwork in the repository
        working-directory: stride-source
        run: |
          git add public/fund-categories
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Vendor supplied fund category artwork"
            git push origin HEAD:feature/sip-social-app
          fi
      - name: Check live Supabase public endpoints
        id: readiness
        working-directory: stride-source
        run: node scripts/check-supabase.mjs
      - name: Combine sites without replacing the website
        run: |
          test ! -e website-source/out/stride
          cp -R stride-source/out website-source/out/stride
          touch website-source/out/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website-source/out
  deploy:
    name: "Publish · ${{ needs.build.outputs.category_images }} images · ${{ needs.build.outputs.backend_status }}"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
